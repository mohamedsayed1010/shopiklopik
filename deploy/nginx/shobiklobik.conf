
server {
    listen 80;
    listen [::]:80;

    server_name YOUR-DOMAIN www.YOUR-DOMAIN;

    root /var/www/shobiklobik;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Caches and CDNs must not hand a gzipped body to a client that cannot read
    # one.
    gzip_vary on;

    # Compress for proxied requests too, not only direct ones.
    gzip_proxied any;


    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        # try_files must come last so the SPA fallback above cannot swallow it.
        try_files $uri =404;
    }

    location ~ ^/(ads\.txt|robots\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /app-ads.txt { return 404; }

    location = /.well-known/security.txt { return 404; }

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }


    client_max_body_size 20M;   # listing photo uploads go through here
}

