
server {
    listen 80;
    listen [::]:80;

    server_name YOUR-DOMAIN www.YOUR-DOMAIN;

    root /var/www/shobiklobik;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Caches and CDNs must not hand a gzipped body to a client that cannot read
    # one.
    gzip_vary on;

    # Compress for proxied requests too, not only direct ones.
    gzip_proxied any;


    # ---------------------------------------------------------------- routing
    #
    # One address per page, with no trailing slash — the form the canonicals,
    # the sitemap and every link in the app already use.
    #
    #   /about        prerendered dist/about/index.html, answered directly (200)
    #   /about/       301 to /about
    #   /login        a real app route with nothing to prerender: dist/app.html (200)
    #   /dynamic/c/s/<guid>
    #                 a listing: the share renderer (200, or 404 for a listing
    #                 the API says does not exist)
    #   anything else 404, with dist/404.html — still the app, so a person
    #                 following a dead link sees the site's not-found page.
    #
    # `$uri/index.html` is tried as a file, not `$uri/` as a directory: the
    # directory form is what made Nginx answer every prerendered address with a
    # 301 to its slash twin, while that twin declared the slash-less address
    # canonical.

    # A trailing slash is never the canonical form. `/` itself does not match.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    # No add_header here: a location that sets one drops every header the
    # server block adds, and those should stay on 404s too.
    location = /404.html {
        internal;
    }

    # The app's own routes that have no prerendered document. Mirrors the route
    # table in src/Routes/index.jsx — a route added there that is not
    # prerendered belongs here too, or the server answers it 404 (people still
    # see the page, since the 404 body is the app; crawlers see a 404).
    # A prerendered document wins when one exists, which covers the content
    # pages when the settings had no text for them at build time.
    location ~ ^/(about|contact|terms|privacy|delete-account|login|register|forgot-password|reset-password|profile|profile/edit|favorites|referrals|banner-booking|my-banner-bookings|payments|payments/new|notifications/settings|create-product)$ {
        try_files $uri/index.html /app.html;
    }

    location ~ ^/create-product/\d+(/\d+)?$ {
        try_files /app.html =404;
    }

    location ~ ^/(banner-bookings|payments)/[A-Za-z0-9-]+$ {
        try_files /app.html =404;
    }

    location ~ "^/admin(/[A-Za-z0-9-]+){0,3}$" {
        try_files /app.html =404;
    }

    location ~ "^/dynamic/\d+/\d+/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/edit$" {
        try_files /app.html =404;
    }

    # A listing. Answered by server/share-renderer.mjs so that a shared link
    # previews as that listing rather than as the home page. The renderer
    # returns the same app shell to every client — it never reads the
    # User-Agent — and the listing stays behind the app's sign-in guard.
    # If it is down, the plain app shell is served instead.
    location ~ "^/dynamic/\d+/\d+/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        # A location with its own error_page inherits none from the server,
        # so the 404 is restated here.
        error_page 404 /404.html;
        error_page 502 503 504 = @app_shell;
    }

    location @app_shell {
        try_files /app.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        # try_files must come last so the SPA fallback above cannot swallow it.
        try_files $uri =404;
    }

    location ~ ^/(ads\.txt|robots\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /app-ads.txt { return 404; }

    location = /.well-known/security.txt { return 404; }

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }


    client_max_body_size 20M;   # listing photo uploads go through here
}

