# =============================================================================
# Shobik Lobik — Nginx site configuration (Hostinger VPS)
#
# Serves the built React/Vite SPA from `dist/` and, optionally, reverse-proxies
# the ASP.NET Core API on the same origin.
#
# PLACEHOLDERS — replace before use. Nothing here invents your values:
#   YOUR-DOMAIN            the production domain (e.g. example.com)
#   /var/www/shobiklobik   where `dist/` is uploaded
#   127.0.0.1:5000         where Kestrel listens, IF you co-host the API
#
# Install:
#   sudo cp shobiklobik.conf /etc/nginx/sites-available/shobiklobik
#   sudo ln -s /etc/nginx/sites-available/shobiklobik /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d YOUR-DOMAIN -d www.YOUR-DOMAIN` after the
# DNS record resolves. Certbot rewrites this file to add the 443 server block
# and the http->https redirect, so do not hand-write those first.
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name YOUR-DOMAIN www.YOUR-DOMAIN;

    root /var/www/shobiklobik;
    index index.html;

    # Vite emits pre-compressible text assets; this is worth having on.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # THE SPA FALLBACK — the one rule this whole file exists for.
    #
    # React Router uses createBrowserRouter (real paths, no hash), so
    # /dynamic/12/52/<id>, /profile, /notifications and /admin/... are routes
    # the *client* knows and the server does not. Opening or hard-refreshing
    # one is a normal HTTP request for a path with no file behind it.
    #
    # `try_files` looks for a real file, then a directory, then hands back
    # index.html so the router can resolve the path in the browser. Without
    # this line every deep link and every refresh is a 404 — including the
    # links a TWA opens from an Android intent.
    #
    # The service worker also has a navigation fallback, but that only applies
    # once it is installed and active. A cold first visit reaches Nginx, so
    # this rule is what makes the very first deep link work.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Service worker: never cache the worker itself.
    #
    # `registerType: "autoUpdate"` means a new deployment is picked up by
    # fetching a changed sw.js. If a proxy or the browser holds an old copy,
    # clients stay pinned to the previous build until that cache expires.
    # -------------------------------------------------------------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # The manifest changes with each release and must be served as JSON.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # -------------------------------------------------------------------------
    # Digital Asset Links — required later, by the TWA.
    #
    # Android fetches https://YOUR-DOMAIN/.well-known/assetlinks.json directly
    # (not through the app) to verify the app owns this origin. It must be
    # served as application/json, over https, with NO redirect — a 301 from
    # http, or from www to apex, fails verification and the TWA falls back to
    # showing a browser URL bar.
    #
    # The file does not exist yet; it needs the Android package name and the
    # release signing SHA-256. See docs/TWA-DEPLOYMENT.md.
    # -------------------------------------------------------------------------
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        # try_files must come last so the SPA fallback above cannot swallow it.
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Crawler-facing text files.
    #
    # ads.txt, robots.txt and sitemap.xml ship in `public/` and therefore exist
    # in `dist/`, so the `try_files $uri` above already serves them as real
    # files. They are named again here only to pin the content type and keep
    # the cache short — Google re-reads ads.txt on its own schedule and a stale
    # copy shows up in AdSense as an earnings warning.
    # -------------------------------------------------------------------------
    location ~ ^/(ads\.txt|robots\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Paths that must 404 rather than fall through to the SPA.
    #
    # Without this, `try_files ... /index.html` answers every one of them with
    # the app shell at 200. A crawler asking for app-ads.txt then parses HTML
    # as seller records, which is worse than being told the file is absent.
    #
    # app-ads.txt belongs here until there is a store-listed app that declares
    # this domain as its developer website; the TWA does not need one, because
    # its ad requests are web requests covered by ads.txt above.
    # security.txt is optional, and an invented one would be worse than none.
    # -------------------------------------------------------------------------
    location = /app-ads.txt { return 404; }

    location = /.well-known/security.txt { return 404; }

    # Vite fingerprints everything in /assets, so those are safe to cache hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # OPTIONAL — only if the ASP.NET Core API is co-hosted on this VPS.
    #
    # Leave commented out while the API stays on its own origin. If you do move
    # it here, set VITE_API_BASE_URL to this domain and rebuild the frontend.
    #
    # The /hubs block is NOT optional once the API is proxied: SignalR upgrades
    # to a WebSocket, and without the Upgrade/Connection headers the handshake
    # fails and notifications silently stop working.
    # -------------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
    #
    # location /hubs/ {
    #     proxy_pass         http://127.0.0.1:5000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 3600s;   # a hub connection is long-lived
    #     proxy_send_timeout 3600s;
    # }

    client_max_body_size 20M;   # listing photo uploads go through here
}
